version: '3.7'
name: building-streaming-app

networks:
  application_network:
    driver: bridge

volumes:
  redpanda-0: null
  ssl-certs:
  ssl-keys:
  console-static-files:
  airflow-static-files:
  data_pipeline-static-files:




services:
  redpanda-0:
    container_name: redpanda-0
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:19092,external://0.0.0.0:9092
      - --advertise-kafka-addr internal://redpanda-0:19092,external://localhost:9092
      - --pandaproxy-addr internal://0.0.0.0:18082,external://0.0.0.0:8082
      - --advertise-pandaproxy-addr internal://redpanda-0:18082,external://localhost:8082
      - --schema-registry-addr internal://0.0.0.0:18081,external://0.0.0.0:8081
      - --smp 1
      - --default-log-level=info
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.10
    volumes:
      - redpanda-0:/var/lib/redpanda/data
    networks:
      - application_network
    ports:
      - 8081:8081
      - 8082:8082
      - 9092:9092
      - 19644:9644




  console:
    container_name: redpanda-console
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    networks:
      - application_network
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda-0:19092"]
          schemaRegistry:
            enabled: true
            urls: ["http://redpanda-0:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda-0:9644"]
    volumes:
      - console-static-files:/app
    ports:
      - 8080:8080
    depends_on:
      - redpanda-0




  dashboard:
    container_name: dashboard
    build: ./dashboard
    ports:
      - "8501:8501"
    environment:
      PYTHONPATH: /
    env_file:
      - ./dashboard/.env




  data_pipeline:
    build: ./data_pipeline
    container_name: data_pipeline
    environment:
      AIRFLOW_HOME: /data_pipeline/src/services/airflow
      PYTHONPATH: /
      AIRFLOW__CORE__DAGS_FOLDER: /data_pipeline/src/services/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: False
    env_file:
      - ./data_pipeline/.env
    volumes:
      - ssl-certs:/etc/ssl/certs
      - ssl-keys:/etc/ssl/private
      - airflow-static-files:/data_pipeline/src/services/airflow/
      - data_pipeline-static-files:/data_pipeline/src/static
    ports:
      - "5000:5000" # Airflow webserver
      - "8000:8000" # FastAPI application
    depends_on:
      - console
    networks:
      - application_network




  ssl_certificates:
    container_name: ssl_certificates
    build: ./security
    volumes:
      - ssl-certs:/etc/ssl/certs
      - ssl-keys:/etc/ssl/private

  nginx:
    container_name: nginx
    image: nginx:latest
    volumes:
      - ./security/nginx.conf:/etc/nginx/conf.d/default.conf
      - ssl-certs:/etc/ssl/certs
      - ssl-keys:/etc/ssl/private
      - console-static-files:/redpanda-console/static # Mount static files for redpanda-console
      - data_pipeline-static-files:/data_pipeline/static  # Mount static files for data_pipeline
      - airflow-static-files:/airflow/static  # Mount static files for Airflow
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - data_pipeline
      - console
      - redpanda-0
    networks:
      - application_network
